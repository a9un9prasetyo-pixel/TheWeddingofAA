<style id="hide-music-patch-v2">
button[title="Putar musik"], button[title="Pause musik"], button[title="Ganti musik"] { display:none !important; }
</style>
<script>
document.addEventListener('DOMContentLoaded', function(){
  function cleanAll(){
    // sembunyikan semua yang mengandung teks target
    const banned = ["Ganti musik","Tutup ganti","Pilih file audio","Ketuk ikon musik","Musik diputar"];
    document.querySelectorAll('*').forEach(el=>{
      const txt = (el.textContent||'').trim();
      if(txt.length>0 && txt.length<50){
        for(const b of banned){
          if(txt.includes(b)){
            el.style.display='none';
            // jika parentnya adalah container kecil, sembunyikan parent juga
            let p = el.parentElement;
            if(p && p.children.length<=2) p.style.display='none';
          }
        }
      }
    });
    // sembunyikan input file audio
    document.querySelectorAll('input[type="file"][accept*="audio"]').forEach(i=>{ i.style.display='none'; i.parentElement.style.display='none'; });
    // sembunyikan tombol dengan icon ♫
    document.querySelectorAll('button, div').forEach(el=>{
      if(el.textContent==='♫' || el.textContent==='♪') el.style.display='none';
    });
  }
  cleanAll();
  setTimeout(cleanAll, 500);
  setTimeout(cleanAll, 1500);
  setTimeout(cleanAll, 3000);
});
</script>

<script>
(function(){
  const overlay = document.getElementById('cover-overlay');
  const btn = document.getElementById('bukaUndanganBtn');
  function burstConfetti(){
    const container = document.createElement('div');
    container.className='confetti-burst';
    const colors=['#FFD93D','#FF6B9D','#4ECDC4','#A8E6CF','#FF8E53','#C44569'];
    for(let i=0;i<28;i++){
      const dot=document.createElement('div');
      dot.className='confetti-dot';
      dot.style.left='50%';
      dot.style.top='45%';
      dot.style.background=colors[i%colors.length];
      const angle=Math.random()*Math.PI*2;
      const dist= 80 + Math.random()*260;
      dot.style.setProperty('--x', Math.cos(angle)*dist+'px');
      dot.style.setProperty('--y', Math.sin(angle)*dist+'px');
      dot.style.animationDelay=(Math.random()*0.15)+'s';
      container.appendChild(dot);
    }
    document.body.appendChild(container);
    setTimeout(()=>container.remove(), 1500);
  }
  if(btn && overlay){
    btn.addEventListener('click', ()=>{
      burstConfetti();
      btn.innerHTML='Membuka...';
      overlay.classList.add('opening');
      setTimeout(()=>{ overlay.style.display='none'; }, 900);
      // scroll to top of content
      window.scrollTo({top:0, behavior:'smooth'});
    });
  }
})();
</script>

<script>
(function(){
  const audio = document.getElementById('bgMusic');
  const toggle = document.getElementById('musicToggleBtn');
  const wave = document.getElementById('waveIcon');
  const mute = document.getElementById('muteIcon');
  let isPlaying = false;

  function updateUI(){
    if(isPlaying && !audio.paused){
      toggle.classList.remove('muted');
      wave.style.display='flex';
      mute.style.display='none';
    } else {
      toggle.classList.add('muted');
      wave.style.display='none';
      mute.style.display='block';
    }
  }

  // Auto play after buka undangan
  const bukaBtn = document.getElementById('bukaUndanganBtn');
  if(bukaBtn){
    bukaBtn.addEventListener('click', ()=>{
      setTimeout(()=>{
        if(audio){
          audio.play().then(()=>{ isPlaying=true; updateUI(); }).catch(()=>{});
        }
      }, 500);
    });
  }

  toggle.addEventListener('click', ()=>{
    if(!audio) return;
    if(audio.paused){
      audio.play().then(()=>{ isPlaying=true; updateUI(); });
    } else {
      audio.pause();
      isPlaying=false;
      updateUI();
    }
  });

  if(audio){
    audio.addEventListener('play', ()=>{ isPlaying=true; updateUI(); });
    audio.addEventListener('pause', ()=>{ isPlaying=false; updateUI(); });
  }
  updateUI();
})();
</script>
